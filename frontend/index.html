<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeWatch v3</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Segoe UI',sans-serif;
background:#0a0f1e;
color:#e2e8f0;
min-height:100vh
}

.header{
background:linear-gradient(135deg,#1e293b,#0f172a);
border-bottom:1px solid #f59e0b33;
padding:16px 32px;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{font-size:24px;font-weight:700;color:#f59e0b}
.logo span{color:white}

.status-badge{
background:#22c55e22;
border:1px solid #22c55e;
color:#22c55e;
padding:6px 14px;
border-radius:20px;
font-size:13px
}

.container{
max-width:1200px;
margin:0 auto;
padding:32px 20px
}

.auth-card{
background:#1e293b;
border:1px solid #334155;
border-radius:16px;
padding:32px;
max-width:480px;
margin:0 auto 32px
}

.input-group{margin-bottom:16px}

.input-group label{
display:block;
margin-bottom:6px;
color:#94a3b8;
font-size:14px
}

.input-group input{
width:100%;
padding:10px 14px;
background:#0f172a;
border:1px solid #334155;
border-radius:8px;
color:white
}

.btn{
width:100%;
padding:12px;
border:none;
border-radius:8px;
font-weight:600;
cursor:pointer
}

.btn-primary{background:#f59e0b;color:#0a0f1e}
.btn-secondary{background:transparent;border:1px solid #f59e0b;color:#f59e0b;margin-top:10px}

.upload-card{
background:#1e293b;
border:1px solid #334155;
border-radius:16px;
padding:32px;
margin-bottom:32px
}

.upload-area{
border:2px dashed #334155;
border-radius:12px;
padding:40px;
text-align:center;
cursor:pointer
}

.upload-area:hover{
border-color:#f59e0b;
background:#f59e0b0a
}

.upload-area input{display:none}

.upload-icon{font-size:48px;margin-bottom:12px}

.analyze-btn{
background:linear-gradient(135deg,#f59e0b,#d97706);
color:#0a0f1e;
border:none;
padding:14px;
border-radius:10px;
font-size:16px;
font-weight:700;
cursor:pointer;
width:100%
}

.loading{
display:none;
text-align:center;
padding:32px;
color:#94a3b8
}

.spinner{
width:40px;height:40px;
border:3px solid #334155;
border-top-color:#f59e0b;
border-radius:50%;
animation:spin 1s linear infinite;
margin:0 auto 16px
}

@keyframes spin{to{transform:rotate(360deg)}}

.results-card{
display:none;
background:#1e293b;
border:1px solid #334155;
border-radius:16px;
padding:32px;
margin-bottom:32px
}

.annotated-img{
width:100%;
border-radius:12px;
border:1px solid #334155;
margin-top:16px
}

.score-circle{
width:80px;height:80px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:700;
border:3px solid #f59e0b;
color:#f59e0b;
margin:0 auto 8px
}
</style>
</head>

<body>

<div class="header">
<div class="logo">🚧 Safe<span>Watch</span></div>
<span class="status-badge">AI System Online</span>
</div>

<div class="container">

<!-- LOGIN -->
<div id="authSection">
<div class="auth-card">

<h2>Login</h2>

<div class="input-group">
<label>Username</label>
<input id="loginUser">
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="loginPass">
</div>

<button class="btn btn-primary" onclick="login()">Login</button>
<button class="btn btn-secondary" onclick="register()">Register</button>

<div id="authMsg"></div>

</div>
</div>

<!-- MAIN APP -->
<div id="appSection" style="display:none">

<div class="upload-card">

<h2>Analyze Safety Compliance</h2>

<div class="upload-area" onclick="document.getElementById('fileInput').click()">

<input type="file" id="fileInput" accept="image/*,video/*" onchange="fileSelected(this)">

<div class="upload-icon">📁</div>
<div>Upload workplace image or video</div>
<div style="font-size:12px;color:#64748b">Supports JPG PNG MP4</div>

<div id="fileName"></div>

</div>

<button id="analyzeBtn" class="analyze-btn" onclick="analyze()" disabled>
Analyze
</button>

</div>

<div id="loading" class="loading">
<div class="spinner"></div>
Running AI analysis...
</div>

<div id="resultsCard" class="results-card">

<h2>Results</h2>

<div style="text-align:center;margin-bottom:20px">

<div id="scoreCircle" class="score-circle">-</div>
<div>Compliance Score</div>

</div>

<div id="visionSummary"></div>

<img id="annotatedImg" class="annotated-img">

</div>

</div>

</div>

<script>

const API="https://safewatch-production.up.railway.app"

let token=localStorage.getItem("safewatch_token")||""

window.onload=()=>{
if(token)showApp()
}

function showApp(){
document.getElementById("authSection").style.display="none"
document.getElementById("appSection").style.display="block"
}

function showAuthMsg(msg){
document.getElementById("authMsg").innerText=msg
}

async function login(){

const username=document.getElementById("loginUser").value
const password=document.getElementById("loginPass").value

const form=new FormData()
form.append("username",username)
form.append("password",password)

const res=await fetch(`${API}/token`,{
method:"POST",
body:form
})

const data=await res.json()

if(res.ok){

token=data.access_token
localStorage.setItem("safewatch_token",token)
showApp()

}else{
showAuthMsg(data.detail)
}

}

async function register(){

const username=document.getElementById("loginUser").value
const password=document.getElementById("loginPass").value

const res=await fetch(`${API}/register?username=${username}&password=${password}`,{
method:"POST"
})

const data=await res.json()

showAuthMsg(data.message||data.detail)

}

function fileSelected(input){

const file=input.files[0]

if(file){

document.getElementById("fileName").innerText=file.name
document.getElementById("analyzeBtn").disabled=false

}

}

async function analyze(){

const file=document.getElementById("fileInput").files[0]

if(!file)return

document.getElementById("loading").style.display="block"
document.getElementById("resultsCard").style.display="none"

const formData=new FormData()
formData.append("file",file)

try{

const isVideo=file.type.startsWith("video/")
const endpoint=isVideo?`${API}/analyze-video`:`${API}/analyze`

const res=await fetch(endpoint,{
method:"POST",
headers:{
Authorization:`Bearer ${token}`
},
body:formData
})

const data=await res.json()

displayResults(data)

}catch(e){
alert("Analysis failed "+e.message)
}

document.getElementById("loading").style.display="none"

}

function displayResults(data){

document.getElementById("resultsCard").style.display="block"

if(data.ai_analysis){

document.getElementById("scoreCircle").innerText=data.ai_analysis.compliance_score||"-"

document.getElementById("visionSummary").innerText=data.ai_analysis.vision_summary||""
// Handle video response differently
if (data.video_stats) {
    document.getElementById("complianceBadge").textContent = data.summary_status
    document.getElementById("complianceBadge").className = "compliance-badge " + 
        (data.summary_status.includes("NON") ? "non-compliant" : "compliant")
    
    document.getElementById("detectionsList").innerHTML = `
        <div class="detection-item">
            <span>Total Frames</span>
            <span style="color:#f59e0b">${data.video_stats.total_frames}</span>
        </div>
        <div class="detection-item">
            <span>Processed Frames</span>
            <span style="color:#f59e0b">${data.video_stats.processed_frames}</span>
        </div>
        <div class="detection-item">
            <span>Duration</span>
            <span style="color:#f59e0b">${data.video_stats.duration_seconds}s</span>
        </div>
        <div class="detection-item">
            <span>Compliance Rate</span>
            <span style="color:#22c55e">${data.compliance_rate}%</span>
        </div>
        <div class="detection-item">
            <span>Violation Frames</span>
            <span style="color:#ef4444">${data.total_violations_found}</span>
        </div>
    `
    
    document.getElementById("violationsList").innerHTML = 
        data.unique_violations.length > 0
            ? data.unique_violations.map(v => `<div class="violation-item">⚠️ ${v}</div>`).join("")
            : "<div style='color:#22c55e'>✅ No violations found</div>"
    
    // Show violation frames if any
    if (data.violation_frames && data.violation_frames.length > 0) {
        document.getElementById("annotatedImg").src = 
            "data:image/jpeg;base64," + data.violation_frames[0].annotated_image
    }
    
    document.getElementById("resultsCard").style.display = "block"
    return
}
}

if(data.annotated_image){

document.getElementById("annotatedImg").src="data:image/jpeg;base64,"+data.annotated_image

}

}

</script>

</body>
</html>
